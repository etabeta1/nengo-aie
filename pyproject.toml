[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nengo_aie"
version = "0.1.0"
dependencies = ["nengo", "numpy"]
description = "Nengo simulator that runs on AMD AI Engines"
authors = [{name = "Andrea Oggioni", email = "andrea1.oggioni@mail.polimi.it"}]

[tool.hatch.build]
packages = ["nengo_aie"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"